<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,interactive-widget=resizes-content"
    />
    <title>Uniway Remote · 裝置中心</title>
    <link rel="stylesheet" href="/dashboard.css" />
    <script type="module" src="/online.mjs"></script>
  </head>
  <body data-page="devices">
    <div class="shell">
      <aside class="rail">
        <div class="wordmark">
          <span class="word-icon"><i data-i="cast"></i></span
          ><span>Uniway <b>Remote</b></span>
        </div>
        <nav aria-label="主選單">
          <button data-page="connect">
            <i data-i="arrow-left-right"></i>遠端控制
          </button>
          <button data-page="devices" aria-current="page">
            <i data-i="collection"></i>裝置列表
          </button>
          <button data-page="settings">
            <i data-i="sliders"></i>進階設定<small id="update-badge" hidden
              >有更新</small
            >
          </button>
        </nav>
        <div class="rail-bottom">
          <i data-i="shield-check"></i
          ><span>Uniway Remote<small>版本 0.5.1</small></span>
        </div>
      </aside>
      <header class="top">
        <label class="search"
          ><i data-i="search"></i
          ><input
            type="search"
            id="search"
            placeholder="搜尋裝置"
            aria-label="搜尋裝置"
        /></label>
        <button class="add" id="add">
          <i data-i="plus-circle"></i>新增連線</button
        ><span id="status" role="status">未連線</span>
      </header>
      <section class="directory" aria-label="裝置列表">
        <div class="directory-title">
          <h1>裝置列表</h1>
          <i data-i="collection"></i>
        </div>
        <h2>這台裝置</h2>
        <button id="self" class="device-row" aria-pressed="true">
          <i data-i="pc-display"></i
          ><span><strong id="self-name"></strong><small>本機裝置</small></span>
        </button>
        <section aria-labelledby="connected-title" aria-live="polite">
          <h2 id="connected-title">
            目前連線 <span id="connected-count">0</span>
          </h2>
          <div id="connected-list"></div>
        </section>
        <div id="known">
          <h2>已儲存的配對 <span id="device-count">…</span></h2>
          <div id="remembered"></div>
          <p id="list-empty">正在讀取配對紀錄…</p>
          <details id="legacy" hidden>
            <summary>舊版配對紀錄 <span id="legacy-count"></span></summary>
            <p>舊版使用了預設名稱。重新連到已更新的對方後，即可辨識名稱。</p>
            <div id="legacy-list"></div>
          </details>
        </div>
      </section>
      <main class="detail">
        <button id="back-list" class="link-button">
          <i data-i="chevron-left"></i>裝置列表
        </button>
        <section id="detail-panel">
          <div class="kicker" id="detail-type">本機裝置</div>
          <h1 id="device-title"></h1>
          <p class="subtitle" id="device-subtitle"></p>
          <section id="hostbox" hidden>
            <button class="primary" id="start">開放連線</button>
            <div id="invitation" hidden>
              <label for="invite">四位數配對碼</label>
              <div class="code-row">
                <input id="invite" readonly aria-label="四位數配對碼" /><button
                  class="icon-button"
                  id="copy"
                  aria-label="複製四位數配對碼"
                >
                  <i data-i="copy"></i>
                </button>
              </div>
            </div>
          </section>
          <h2 class="section-title">裝置操作</h2>
          <div class="tiles">
            <button id="action-connect">
              <i class="blue" data-i="display-fill"></i><span>遠端控制</span>
            </button>
            <button id="action-view">
              <i class="violet" data-i="eye-fill"></i><span>觀看模式</span>
            </button>
            <button id="action-settings">
              <i class="teal" data-i="sliders"></i><span>連線設定</span>
            </button>
            <button id="phone-share" hidden>
              <i class="blue" data-i="cast"></i><span>分享本機</span>
            </button>
            <button id="forget" hidden>
              <i class="slate" data-i="link-45deg"></i><span>解除配對</span>
            </button>
          </div>
        </section>
        <section id="connect-panel" hidden>
          <div class="kicker">跨網路連線</div>
          <h1>遠端控制</h1>
          <div id="joinbox">
            <form id="join">
              <h2>連接另一台裝置</h2>
              <label for="code">對方的四位數配對碼</label>
              <input
                required
                id="code"
                inputmode="numeric"
                placeholder="0000"
                autocomplete="off"
                maxlength="1024"
              /><button class="primary" id="connect">連接裝置</button>
              <p class="muted">
                輸入第四碼即送出配對。已配對的裝置可從列表直接連接。
              </p>
            </form>
          </div>
        </section>
        <section id="settings-panel" hidden>
          <div class="kicker">這台裝置</div>
          <h1>進階設定</h1>
          <label for="name">裝置名稱</label
          ><input id="name" required maxlength="48" />
          <details open id="settings">
            <summary>配對服務</summary>
            <label for="relay">HTTPS 網址</label
            ><input id="relay" type="url" spellcheck="false" />
          </details>
          <a id="lan" hidden>區網 WebRTC、音訊及隱私模式</a>
          <section id="updates" hidden>
            <h2>軟體更新</h2>
            <p id="update-status" role="status"></p>
            <button id="check-update">檢查更新</button
            ><button class="primary" id="install-update" hidden>
              立即更新
            </button>
          </section>
        </section>
        <div id="devices" aria-live="polite"></div>
        <div class="session-status">
          <p id="message" role="status"></p>
          <button id="stop" hidden>停止接受連線</button>
        </div>
      </main>
    </div>
    <section id="stage" hidden>
      <canvas id="picture" tabindex="0" aria-label="遠端螢幕"></canvas>
      <textarea
        id="ime"
        aria-label="遠端文字輸入"
        rows="1"
        autocapitalize="off"
        autocomplete="off"
        spellcheck="false"
        hidden
      ></textarea>
      <div class="viewer-bar">
        <button id="keyboard-button" hidden aria-label="手機鍵盤">
          <i data-i="keyboard"></i>
        </button>
        <details id="video-menu">
          <summary aria-label="畫質與幀率"><i data-i="sliders"></i></summary>
          <div class="video-options">
            <h2>畫面設定</h2>
            <label for="quality">畫質上限</label
            ><select id="quality">
              <option value="960">540p · 省流量</option>
              <option value="1280">720p · 標準</option>
              <option value="1920" selected>1080p · 高畫質</option>
            </select>
            <label for="fps">目標幀率</label
            ><select id="fps">
              <option value="30">30 fps</option>
              <option value="60">60 fps</option>
            </select>
            <p id="stats">正在接收畫面</p>
          </div>
        </details>
        <button id="leave" hidden><i data-i="box-arrow-right"></i>離開</button>
      </div>
    </section>
    <button id="cancel" hidden>取消連線</button>
  </body>
</html>
