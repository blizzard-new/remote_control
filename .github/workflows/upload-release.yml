name: Attach verified 0.5.9 downloads

on:
  push:
    branches: [release-assets/v0.5.9]

jobs:
  upload:
    if: github.ref == 'refs/heads/release-assets/v0.5.9'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_ID: '45784438950'
      SOURCE_SHA: ca1ad728fec01bec27583dc7bc879e23ca365377
    steps:
      - uses: actions/checkout@v4
      - name: Check build and draft target
        run: |
          gh run watch "$BUILD_ID" --interval 15 --exit-status
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_ID" | jq -e --arg sha "$SOURCE_SHA" '.conclusion == "success" and .head_sha == $sha'
          gh release view v0.5.9 --json isDraft,targetCommitish | jq -e --arg sha "$SOURCE_SHA" '.isDraft and .targetCommitish == $sha'
      - uses: actions/download-artifact@v4
        with:
          run-id: 45784438950
          github-token: ${{ github.token }}
          path: build-artifacts
      - name: Assemble and checksum downloads
        run: |
          mkdir downloads
          cp build-artifacts/Windows-desktop-host/RemoteControlHost.exe downloads/RemoteControl-Windows-x64.exe
          cp build-artifacts/Mac-host-macos-15/RemoteControl-macOS-arm64.zip downloads/
          cp build-artifacts/Mac-host-macos-15-intel/RemoteControl-macOS-x86_64.zip downloads/
          cp build-artifacts/Windows-desktop-host/RemoteControl-Setup-Windows-x64.exe downloads/
          cp build-artifacts/Mac-host-macos-15/RemoteControl-macOS-arm64.pkg downloads/
          cp build-artifacts/Mac-host-macos-15-intel/RemoteControl-macOS-x86_64.pkg downloads/
          cp build-artifacts/Linux-desktop-host/RemoteControl-Linux-amd64.deb downloads/
          cp packaging/release/RemoteControl-Android.apk downloads/
          cd downloads
          gh release download v0.5.8 -p RemoteControl-Server-Windows.zip
          sha256sum --check <<'SUMS'
          bea0602c4a13e250113b2ab5a0a4d5d12b43650183fe48543bd1968091aa39cf  RemoteControl-Android.apk
          8eb76853034c37604f13d8ae9fc657de4503be1c5f365cb954554c5c5ac22c2d  RemoteControl-Server-Windows.zip
          SUMS
          sha256sum RemoteControl* > SHA256SUMS.txt
          gh release upload v0.5.9 --clobber RemoteControl* SHA256SUMS.txt
