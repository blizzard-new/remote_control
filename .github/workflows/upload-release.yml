name: Attach verified 0.3.0 downloads

on:
  push:
    branches: [release-assets/v0.3.0]

jobs:
  upload:
    if: github.ref == 'refs/heads/release-assets/v0.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_ID: '44939591092'
      SOURCE_SHA: 353e4a4a64452898b6dce41a48a002f70521a078
    steps:
      - uses: actions/checkout@v4
      - name: Check build and draft target
        run: |
          gh run watch "$BUILD_ID" --interval 15 --exit-status
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_ID" | jq -e --arg sha "$SOURCE_SHA" '.conclusion == "success" and .head_sha == $sha'
          gh release view v0.3.0 --json isDraft,targetCommitish | jq -e --arg sha "$SOURCE_SHA" '.isDraft and .targetCommitish == $sha'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44939591092
          github-token: ${{ github.token }}
          path: build-artifacts
      - name: Assemble and checksum downloads
        run: |
          mkdir downloads
          cp build-artifacts/Windows-desktop-host/RemoteControlHost.exe downloads/RemoteControl-Windows-x64.exe
          cp build-artifacts/Mac-host-macos-15/RemoteControl-macOS-arm64.zip downloads/
          cp build-artifacts/Mac-host-macos-15-intel/RemoteControl-macOS-x86_64.zip downloads/
          cp packaging/release/RemoteControl-Android.apk downloads/
          cd downloads
          gh release download v0.2.1 -p RemoteControl-Server-Windows.zip
          sha256sum --check <<'SUMS'
          948bbb1641de1c2d2ff580112afed1afef21707d66e9ae947d85cb71a6eb3075  RemoteControl-Android.apk
          8eb76853034c37604f13d8ae9fc657de4503be1c5f365cb954554c5c5ac22c2d  RemoteControl-Server-Windows.zip
          SUMS
          sha256sum RemoteControl* > SHA256SUMS.txt
          gh release upload v0.3.0 RemoteControl* SHA256SUMS.txt
