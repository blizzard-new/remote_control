name: Attach verified 0.2.1 downloads

on:
  push:
    branches: [release-assets/v0.2.1]

jobs:
  upload:
    if: github.ref == 'refs/heads/release-assets/v0.2.1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_ID: '44935521891'
      SOURCE_SHA: ff3f8d3f786686f386f3e7bf1f70c5f2a08626af
    steps:
      - uses: actions/checkout@v4
      - name: Check build and draft target
        run: |
          gh run watch "$BUILD_ID" --interval 15 --exit-status
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_ID" | jq -e --arg sha "$SOURCE_SHA" '.conclusion == "success" and .head_sha == $sha'
          gh release view v0.2.1 --json isDraft,targetCommitish | jq -e --arg sha "$SOURCE_SHA" '.isDraft and .targetCommitish == $sha'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44935521891
          github-token: ${{ github.token }}
          path: build-artifacts
      - name: Assemble and checksum downloads
        run: |
          mkdir downloads
          cp build-artifacts/Windows-desktop-host/RemoteControlHost.exe downloads/RemoteControl-Windows-x64.exe
          cp build-artifacts/Mac-host-macos-15/RemoteControl-macOS-arm64.zip downloads/
          cp build-artifacts/Mac-host-macos-15-intel/RemoteControl-macOS-x86_64.zip downloads/
          cd downloads
          gh release download v0.2.0 -p RemoteControl-Android.apk -p RemoteControl-Server-Windows.zip
          sha256sum --check <<'SUMS'
          42aa5002fa9e20fa5104ff553cc554023ae841b63f1cb5a9a1f78809656f41a9  RemoteControl-Android.apk
          8eb76853034c37604f13d8ae9fc657de4503be1c5f365cb954554c5c5ac22c2d  RemoteControl-Server-Windows.zip
          SUMS
          sha256sum RemoteControl* > SHA256SUMS.txt
          gh release upload v0.2.1 RemoteControl* SHA256SUMS.txt
