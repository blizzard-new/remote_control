name: Verify 0.5.9 Intel Mac viewer

on:
  push:
    branches: [verify/v0.5.9-intel]

permissions:
  actions: read
  contents: read

jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 45780252933
          github-token: ${{ github.token }}
          name: android-projected-test-screen
          path: build/phone-fixture
      - run: python -m pip install -r requirements.txt 'playwright==1.62.0'
      - run: python -m playwright install webkit
      - run: python -u -m unittest discover -s tests -p browser_phone_screen.py -v
        timeout-minutes: 5
        env:
          REMOTE_BROWSER: webkit
          REMOTE_DESKTOP_PLATFORM: Darwin
          REMOTE_ANDROID_FRAME: build/phone-fixture/verified-phone-screen.jpg
