name: Verify 0.5.9 Intel Mac viewer

on:
  push:
    branches: [verify/v0.5.9-intel]

permissions:
  actions: read
  contents: read

jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 45780252933
          github-token: ${{ github.token }}
          name: android-projected-test-screen
          path: build/phone-fixture
      - run: python -m pip install -r requirements.txt 'playwright==1.62.0'
      - run: python -m playwright install webkit
      - run: |
          export PYTHONPATH=.:tests
          for test in             test_open_phone_screen_from_an_active_incoming_connection             test_phone_receives_the_requested_desktop_detail_and_resolution             test_phone_switches_monitors_and_clicks_the_visible_screen             test_scrolling_preserves_selected_resolution_and_uses_native_jpeg
          do
            python -u -m unittest "browser_phone_screen.PhoneScreenSmoke.$test" -v || exit $?
          done
        timeout-minutes: 6
        env:
          REMOTE_BROWSER: webkit
          REMOTE_DESKTOP_PLATFORM: Darwin
          REMOTE_ANDROID_FRAME: build/phone-fixture/verified-phone-screen.jpg
