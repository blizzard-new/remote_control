name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxtst6 libxrandr2 x11-xkb-utils
      - if: runner.os == 'Windows'
        run: python -m pip install windows-capture==2.0.1
      - run: python -m unittest discover -s tests -v
        env:
          REMOTE_TEST_WINDOWS_CURTAIN: ${{ runner.os == 'Windows' && '1' || '0' }}
      - run: node --test tests/input.test.mjs android/tests/avc-player.test.mjs
      - if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests -p browser_smoke.py -v
      - if: runner.os == 'Windows'
        name: Check relay installer syntax
        shell: pwsh
        run: |
          $syntaxErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'deploy/Install-Relay.ps1'), [ref]$null, [ref]$syntaxErrors)
          if ($syntaxErrors) { throw ($syntaxErrors -join [Environment]::NewLine) }
      - if: runner.os == 'Windows'
        run: |
          python -m pip install "pyinstaller>=6.12,<7"
          python -m PyInstaller --clean --noconfirm packaging/RemoteControlHost.spec
          python packaging/smoke_windows.py dist/RemoteControlHost.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/RemoteControl.iss
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-host
          path: |
            dist/RemoteControlHost.exe
            dist/RemoteControl-Setup-Windows-x64.exe
          if-no-files-found: error

      - if: runner.os == 'macOS'
        name: Package and verify the Mac app
        run: |
          mkdir -p build
          swiftc -O -parse-as-library -target "$(uname -m)-apple-macos12.3" packaging/PrimaryDisplay.swift -o build/PrimaryDisplay
          python -m pip install "pyinstaller>=6.12,<7"
          python -m PyInstaller --clean --noconfirm packaging/RemoteControlHost.spec
          python packaging/smoke_windows.py dist/RemoteControl.app/Contents/MacOS/RemoteControl
          codesign --verify --deep --strict dist/RemoteControl.app
          pkgbuild --component dist/RemoteControl.app --install-location /Applications --identifier org.remotecontrol.desktop --version 0.4.0 "RemoteControl-macOS-$(uname -m).pkg"
          ditto -c -k --keepParent dist/RemoteControl.app "RemoteControl-macOS-$(uname -m).zip"
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Mac-host-${{ matrix.os }}
          path: |
            RemoteControl-macOS-*.zip
            RemoteControl-macOS-*.pkg
          if-no-files-found: error

  android:
    name: Android APK and screen capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Android-screen-host
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell svc wifi enable
            bash android/tests/run-projection-test.sh
