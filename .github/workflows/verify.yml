name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxtst6 libxrandr2 x11-xkb-utils
      - if: runner.os == 'Windows'
        run: python -m pip install windows-capture==2.0.1
      - run: python -m unittest discover -s tests -v
        env:
          REMOTE_TEST_WINDOWS_CURTAIN: ${{ runner.os == 'Windows' && '1' || '0' }}
      - run: node --test tests/input.test.mjs android/tests/avc-player.test.mjs
      - if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests -p browser_smoke.py -v
      - if: runner.os == 'Windows'
        run: |
          python -m pip install "pyinstaller>=6.12,<7"
          python -m PyInstaller --clean --noconfirm packaging/RemoteControlHost.spec
          python packaging/smoke_windows.py dist/RemoteControlHost.exe
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-host
          path: dist/RemoteControlHost.exe
          if-no-files-found: error

  android:
    name: Android APK and screen capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Android-screen-host
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell svc wifi enable
            bash android/tests/run-projection-test.sh
